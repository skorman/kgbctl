[package]
name = "kgbctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
futures = "0.3.34"
getrandom = "0.3"
hmac = "0.13.0"
ibapi = "5.7.0"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Decoding and scaling the splash GIF is slow unoptimized.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
